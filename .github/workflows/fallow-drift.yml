name: Fallow (drift scan)

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallow-drift
  cancel-in-progress: true

jobs:
  drift-scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A hit means these exact dependency inputs already passed the
      # canonical covered gate. actions/cache saves misses only on job success.
      - name: Restore dependency marker
        id: seen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fallow-drift
          key: fallow-drift-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Setup pnpm and Node.js
        if: steps.seen.outputs.cache-hit != 'true'
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node
          cache: true
          install: false

      - name: Install dependencies
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate canonical coverage
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm test:coverage

      - name: Run canonical Fallow gate
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          test -f coverage/coverage-final.json
          pnpm fallow:ci
        env:
          FALLOW_AUDIT_BASE: origin/main

      # This step and the cache save are unreachable when install, coverage, or
      # Fallow fails, so failed dependency inputs remain eligible for a later retry.
      - name: Mark dependencies as scanned
        if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .fallow-drift && date > .fallow-drift/success
