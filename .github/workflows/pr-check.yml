name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static quality checks, tests, and the two Fallow passes run as parallel jobs
  # so pull requests go green as fast as possible. Each is its own required
  # status check (the main-branch ruleset lists these exact names), so every one
  # must pass for a merge.
  #
  # Note: running static and test in parallel with `cache: true` means lockfile cache
  # misses (e.g. dependency bump PRs) may log a harmless "Unable to reserve cache"
  # warning when both jobs finish and race to save the key. See docs/ci.md.
  static:
    name: Lint, typecheck & format
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node
          cache: true

      # Generates coverage/coverage-final.json; both Fallow jobs consume it, so
      # tests must run before they start.
      - name: Test with coverage
        run: pnpm test:coverage

      # Shared with the two Fallow jobs below so they do not reinstall and
      # re-run the suite just to score the same evidence.
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Fallow gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node
          cache: true

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      # Strict changed-file audit plus one combined full-repository scan.
      # Pre-push and the version-drift workflow use the same package script.
      - name: Fallow CI gate
        run: pnpm fallow:ci
        env:
          FALLOW_AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}

  review:
    name: Fallow PR review
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node
          cache: true

      # Fallow installs its CLI globally with npm. The runtime managed by
      # pnpm/setup can use a different npm prefix, so expose that bin directory.
      - name: Expose npm global binaries
        run: echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      # The Action reads the CLI version from package.json and analysis policy
      # from .fallowrc.json, including complete type-aware evidence, gate: all,
      # and semantic/near duplication. It renders each PR surface from one audit.
      - name: Fallow audit
        uses: fallow-rs/fallow@4f3bd9720ca6b22c8547adb7f1d225f57fc502d4 # v3.26.0
        with:
          command: audit
          format: json
          changed-since: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          comment: true
          comment-layout: compact
          review-comments: true
          review-guidance: true
          branded-token: false
