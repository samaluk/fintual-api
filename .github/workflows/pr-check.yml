name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, test & Fallow ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Read pnpm version
        id: pnpm
        run: |
          version="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ steps.pnpm.outputs.version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      # Generates coverage/coverage-final.json; fallow health/CRAP and the
      # audit gate below consume it, so tests must run first.
      - name: Test with coverage
        run: pnpm test:coverage

      # Authoritative Fallow ratchet: changed-code audit (new-only, type-aware),
      # project-wide identity baselines, regression counts, and baseline
      # freshness. Mirrors `pnpm fallow:ci` run locally.
      - name: Fallow CI gate
        run: pnpm fallow:ci

  fallow:
    name: Fallow PR annotations & code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Read pnpm version
        id: pnpm
        run: |
          version="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ steps.pnpm.outputs.version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same coverage evidence the check job uses, so audit CRAP scoring matches.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Fallow audit (annotations, sticky comment, SARIF)
        # Pinned to the v3.16.0 release commit; the `version` input keeps the
        # CLI aligned with the pinned local fallow dependency.
        uses: fallow-rs/fallow@45fd28766199acb1f939f6862274a37aad12770b # v3.16.0
        with:
          version: 3.16.0
          command: audit
          gate: new-only
          type-aware: auto
          coverage: coverage/coverage-final.json
          dead-code-baseline: fallow-baselines/dead-code.json
          health-baseline: fallow-baselines/health.json
          dupes-baseline: fallow-baselines/dupes.json
          annotations: true
          comment: true
          sarif: true
